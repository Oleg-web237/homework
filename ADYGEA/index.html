<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./css/index.css">
  <title>Джипинг</title>
  <script src="./JS/burger.js" defer></script>
</head>

<body class="page__body">
  <header class="header">
    <div class="container header__container">
      <div class="header__inner">
        <a href="#" aria-label="Adygea Tours — на главную" class="header__logo-link">
          <img class="logo header__logo" src="./icons/icon-logo/logo-logo-webp.jpg" alt="Логотип" width="100"
            height="100">
        </a>
        <nav class="menu header__menu" aria-label="Основная навигация" id="header__menu">
          <ul class="menu__list">
            <li class="menu__item">
              <a href="" class="menu__link">Главная</a>
            </li>
            <li class="menu__item">
              <a href="" class="menu__link" aria-current="page">Джипинг</a>
            </li>
            <li class="menu__item">
              <a href="" class="menu__link">Квадроциклы</a>
            </li>
            <li class="menu__item">
              <a href="" class="menu__link">Рафтинг</a>
            </li>
            <li class="menu__item">
              <a href="" class="menu__link">Конные прогулки</a>
            </li>
            <li class="menu__item">
              <a href="" class="menu__link">О нас</a>
            </li>
            <li class="menu__item">
              <a href="" class="menu__link">Контакты</a>
            </li>
          </ul>
        </nav>
        <a href="#booking" class="header__btn btn--accent">
          Забронировать
        </a>
        <button class="header__burger burger" aria-label="Открыть меню" aria-expanded="false"
          aria-controls="header__menu">
          <svg class="burger__icon-menu" width="40" height="40">
            <use href="./icons/sprite.svg#burger-menu"></use>
          </svg>
          <svg class="burger__icon-cross" width="40" height="40">
            <use href="./icons/sprite.svg#cross-menu"></use>
          </svg>
        </button>
      </div>
    </div>
  </header>
</body>

</html>
